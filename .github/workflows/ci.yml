name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: cargo fmt
        run: nix develop .#rust -c cargo fmt --all -- --check
      - name: clippy
        run: nix develop .#rust -c cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: nix develop .#rust -c cargo test --manifest-path core/Cargo.toml
      - name: rustdoc
        run: nix develop .#rust -c env RUSTDOCFLAGS='-D warnings' cargo doc --no-deps
      - name: pins
        run: nix develop .#rust -c ./scripts/check-pins
      - name: cargo-deny
        run: nix develop .#rust -c cargo deny check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -hT /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell
          sudo docker image prune -af || true
          df -hT /
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: kotlin tests
        run: nix develop -c ./gradlew :app:testDebugUnitTest
      - name: assemble debug
        run: nix develop -c ./gradlew :app:assembleDebug

  apks:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [rust, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          df -hT /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell
          sudo docker image prune -af || true
          df -hT /
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/geiravor-release.jks"
          printf '%s' "$RELEASE_KEYSTORE" | base64 -d >"$ks"
          chmod 600 "$ks"
          umask 077
          {
            printf 'storeFile=%s\n' "$ks"
            printf 'storePassword=%s\n' "$RELEASE_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } >keystore.properties
      - name: upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-apks --upload "${{ github.ref_name }}"
